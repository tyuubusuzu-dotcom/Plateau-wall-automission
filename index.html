<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドローン外壁ジグザグ飛行ルート生成アプリ</title>
    <!-- Cesiumの内部ファイルを正しく読み込むための必須設定 -->
    <script>
        window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/';
    </script>
    <!-- CesiumJS CSS -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background: #1e1e1e;
        }
        #panel {
            position: absolute; top: 15px; left: 15px; background: rgba(255, 255, 255, 0.95);
            padding: 15px; border-radius: 8px; z-index: 100; width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-height: 90vh; overflow-y: auto;
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-bottom: 10px; }
        h3 { margin: 0; font-size: 15px; color: #333; }
        .version { font-size: 11px; color: #666; font-weight: bold; }
        label { display: block; margin-top: 8px; font-size: 12px; font-weight: bold; color: #444; }
        input[type="text"], input[type="number"] { width: 100%; padding: 6px; margin-top: 3px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .coord-group { display: flex; gap: 5px; margin-top: 3px; }
        .coord-group input { flex: 1; }
        button { width: 100%; padding: 8px; margin-top: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; font-size: 13px; }
        .btn-primary { background: #007bff; }
        .btn-primary:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-success:disabled, .btn-warning:disabled, .btn-danger:disabled, .btn-info:disabled { background: #ccc; cursor: not-allowed; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-warning:hover { background: #e0a800; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-3d { background: #17a2b8; color: #fff; }
        .btn-3d:hover { background: #138496; }
        .btn-info { background: #007bff; color: #fff; }
        .btn-info:hover { background: #0056b3; }
        .status { margin-top: 10px; font-size: 12px; color: #d9534f; background: #fdf7f7; padding: 8px; border-radius: 4px; border: 1px solid #ebccd1; line-height: 1.4; }
        .search-box { display: flex; gap: 5px; margin-top: 4px; }
        .search-box input { flex: 1; }
        .search-box button { width: 80px; margin-top: 0; padding: 6px; }
        .zoom-controls { display: flex; gap: 5px; margin-top: 8px; }
        .zoom-controls button { margin-top: 0; flex: 1; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    
    <div id="panel">
        <div class="panel-header">
            <h3>外壁点検ルート自動生成</h3>
            <span class="version">Ver.2.8.2</span>
        </div>

        <!-- 住所検索Box -->
        <label>住所・地名検索:</label>
        <div class="search-box">
            <input type="text" id="addressInput" placeholder="例: 大阪市中央区難波1丁目">
            <button id="searchBtn" class="btn-primary">検索</button>
        </div>

        <!-- 3Dビルモデル読込ボタン -->
        <button id="load3dBtn" class="btn-3d">3Dビルモデルを表示する（300m圏内最適化）</button>

        <!-- 画面拡大縮小ボタン ＆ 北向きリセットボタン -->
        <div class="zoom-controls">
            <button id="zoomInBtn" class="btn-info">＋ 拡大</button>
            <button id="zoomOutBtn" class="btn-info">－ 縮小</button>
            <button id="resetNorthBtn" class="btn-secondary" title="カメラの向きを北向きに揃える">北向きリセット</button>
        </div>

        <div class="status" id="instruction">
            1. 地図上でビルをクリックしてください（<strong>コーナー自動抽出モード</strong>）。
        </div>

        <!-- A地点実測座標（D-RTK3補正用） -->
        <label>A地点 実測座標 (D-RTK3 緯度 / 経度) [任意]:</label>
        <div class="coord-group">
            <input type="text" id="measuredLatA" placeholder="緯度">
            <input type="text" id="measuredLonA" placeholder="経度">
        </div>

        <!-- B地点実測座標（D-RTK3補正用） -->
        <label>B地点 実測座標 (D-RTK3 緯度 / 経度) [任意]:</label>
        <div class="coord-group">
            <input type="text" id="measuredLatB" placeholder="緯度">
            <input type="text" id="measuredLonB" placeholder="経度">
        </div>

        <label>壁からのオフセット距離 (m):</label>
        <input type="number" id="offsetDist" value="5.0" step="0.5">
        
        <label>上方のオフセット距離 (m):</label>
        <input type="number" id="upwardOffset" value="0.0" step="0.5">

        <label>垂直ピッチ（何mおきに下がるか） (m):</label>
        <input type="number" id="pitchDist" value="1.0" step="0.5">

        <label>A側（左）の延長距離 (m):</label>
        <input type="number" id="extendA" value="0.0" step="0.5">

        <label>B側（右）の延長距離 (m):</label>
        <input type="number" id="extendB" value="0.0" step="0.5">

        <label>飛行させない最低地上高 (m):</label>
        <input type="number" id="minHeightFromGround" value="2.0" step="0.5">

        <button id="recalculateBtn" class="btn-warning" disabled>ルート再計算・シフト適用</button>
        <button id="clearSelectionBtn" class="btn-danger">地点選択やり直し</button>
        <button id="exportBtn" class="btn-success" disabled>ルート座標をCSVダウンロード</button>
        <button id="exportKmlBtn" class="btn-success" disabled>ルート座標をKMLダウンロード</button>
        <button id="resetBtn" class="btn-secondary">リセット（ルート・設定初期化）</button>
    </div>

    <!-- CesiumJS JS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    <script>
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjdlVjdMdUZ0VHhhdFlxTkoiLCJqdGkiOiIzZjY3NzkwNy1jMTVlLTQwYzEtYjZkMS1hZDgxY2Y0ODA3YWEiLCJpZCI6NDkzOTQ3LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODkzODYwNjR9.wV7l2BvempXsAWlEzEkLuyh2KDeCOqmlx1-NnF69yKw';

        const defaultLocation = {
            lon: 135.524223,
            lat: 34.654049,
            height: 400,
            heading: 0.0,
            pitch: -45.0,
            roll: 0.0
        };

        const todayStr = new Date().toISOString().split('T')[0];
        const savedDate = localStorage.getItem('drone_app_date');
        const savedPos = JSON.parse(localStorage.getItem('drone_app_position') || 'null');

        let initialCam = (savedDate === todayStr && savedPos) ? savedPos : defaultLocation;
        if (savedDate !== todayStr) {
            localStorage.setItem('drone_app_date', todayStr);
        }

        const osmImagery = new Cesium.OpenStreetMapImageryProvider({
            url: 'https://tile.openstreetmap.org/'
        });

        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProvider: osmImagery,
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            sceneModePicker: false,
            navigationHelpButton: false
        });

        // マウスホイールズーム方向逆転 ＆ 滑らかなカスタム制御
        viewer.scene.screenSpaceCameraController.enableZoom = false;
        const wheelHandler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        wheelHandler.setInputAction(function(delta) {
            const camera = viewer.camera;
            const height = camera.positionCartographic.height;
            const zoomRatio = 0.12;
            if (delta > 0) {
                camera.zoomIn(Math.min(height * zoomRatio, height * 0.85));
            } else {
                camera.zoomOut(height * zoomRatio);
            }
        }, Cesium.ScreenSpaceEventType.WHEEL);

        // 画面拡大ボタン（＋）
        document.getElementById('zoomInBtn').addEventListener('click', function() {
            const currentHeight = viewer.camera.positionCartographic.height;
            viewer.camera.zoomIn(currentHeight * 0.25);
        });

        // 画面縮小ボタン（－）
        document.getElementById('zoomOutBtn').addEventListener('click', function() {
            const currentHeight = viewer.camera.positionCartographic.height;
            viewer.camera.zoomOut(currentHeight * 0.25);
        });

        // 北向きリセットボタン
        document.getElementById('resetNorthBtn').addEventListener('click', function() {
            const currentPosition = viewer.camera.position;
            const currentPitch = viewer.camera.pitch;
            viewer.camera.flyTo({
                destination: currentPosition,
                orientation: {
                    heading: Cesium.Math.toRadians(0.0),
                    pitch: currentPitch,
                    roll: 0.0
                },
                duration: 0.6
            });
        });

        async function initBaseImagery() {
            try {
                const imageryProvider = await Cesium.createWorldImageryAsync();
                viewer.imageryLayers.addImageryProvider(imageryProvider);
            } catch (e) {
                console.error("背景画像の読み込みに失敗しました:", e);
            }
        }
        initBaseImagery();

        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(initialCam.lon, initialCam.lat, initialCam.height),
            orientation: {
                heading: Cesium.Math.toRadians(initialCam.heading),
                pitch: Cesium.Math.toRadians(initialCam.pitch),
                roll: Cesium.Math.toRadians(initialCam.roll)
            }
        });

        viewer.camera.moveEnd.addEventListener(() => {
            const cartographic = viewer.camera.positionCartographic;
            const currentPos = {
                lon: Cesium.Math.toDegrees(cartographic.longitude),
                lat: Cesium.Math.toDegrees(cartographic.latitude),
                height: cartographic.height,
                heading: Cesium.Math.toDegrees(viewer.camera.heading),
                pitch: Cesium.Math.toDegrees(viewer.camera.pitch),
                roll: Cesium.Math.toDegrees(viewer.camera.roll)
            };
            localStorage.setItem('drone_app_position', JSON.stringify(currentPos));
            localStorage.setItem('drone_app_date', new Date().toISOString().split('T')[0]);
        });

        async function searchAddress() {
            const query = document.getElementById('addressInput').value.trim();
            if (!query) return;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=jp&q=${encodeURIComponent(query)}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    const lon = parseFloat(data[0].lon);
                    const lat = parseFloat(data[0].lat);
                    viewer.camera.flyTo({
                        destination: Cesium.Cartesian3.fromDegrees(lon, lat, 300),
                        orientation: { heading: 0.0, pitch: Cesium.Math.toRadians(-45), roll: 0.0 }
                    });
                } else {
                    alert('該当する場所が見つかりませんでした。');
                }
            } catch (e) {
                console.error(e);
                alert('住所検索の通信に失敗しました。');
            }
        }

        document.getElementById('searchBtn').addEventListener('click', searchAddress);
        document.getElementById('addressInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchAddress();
        });

        let buildingsLoaded = false;
        document.getElementById('load3dBtn').addEventListener('click', async function() {
            if (buildingsLoaded) {
                alert('3Dビルモデルは既に表示されています。');
                return;
            }
            try {
                const osmBuildings = await Cesium.createOsmBuildingsAsync();
                osmBuildings.dynamicScreenSpaceError = true;
                osmBuildings.dynamicScreenSpaceErrorDensity = 0.005;
                osmBuildings.maximumMemoryUsage = 256;

                viewer.scene.primitives.add(osmBuildings);
                buildingsLoaded = true;
                alert('3Dビルモデルを300m圏内最適モードで正常に読み込みました！');
            } catch (err) {
                console.error(err);
                alert('3Dビルの読み込みに失敗しました。');
            }
        });

        let clickStep = 0;
        let pointP1 = null; 
        let pointP2 = null; 
        let detectedBuildingHeight = 30.0;
        let generatedWaypoints = [];
        let routeEntity = null;
        let pointEntities = [];

        async function fetchBuildingCorners(elementId) {
            try {
                const url = `https://overpass-api.de/api/interpreter?data=[out:json];way(${elementId});out geom;`;
                const response = await fetch(url);
                const data = await response.json();
                if (data.elements && data.elements.length > 0) {
                    const way = data.elements[0];
                    if (way.geometry && way.geometry.length > 0) {
                        let nodes = way.geometry;
                        if (nodes.length > 1 && nodes[0].lat === nodes[nodes.length-1].lat && nodes[0].lon === nodes[nodes.length-1].lon) {
                            nodes.pop();
                        }
                        return nodes;
                    }
                }
            } catch (e) {
                console.warn("Overpass API取得エラー", e);
            }
            return null;
        }

        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        handler.setInputAction(async function (movement) {
            const picked = viewer.scene.pick(movement.position);
            const pickedPosition = viewer.scene.pickPosition(movement.position);
            if (!pickedPosition) {
                alert('3Dビルモデルの表面を正確にクリックしてください。');
                return;
            }

            let clickedCarto = Cesium.Cartographic.fromCartesian(pickedPosition);
            let estHeight = 30.0;

            if (picked && picked.getProperty) {
                const estH = picked.getProperty('cesium#estimatedHeight') || picked.getProperty('height');
                if (estH) estHeight = parseFloat(estH);
            }
            detectedBuildingHeight = estHeight;

            let elementId = null;
            if (picked && picked.getProperty) {
                elementId = picked.getProperty('elementId') || picked.getProperty('id');
            }

            if (clickStep === 0) {
                if (elementId) {
                    const corners = await fetchBuildingCorners(elementId);
                    if (corners && corners.length >= 3) {
                        let closestIdx = 0;
                        let minDist = Infinity;
                        corners.forEach((c, idx) => {
                            const dist = Math.hypot(c.lat - Cesium.Math.toDegrees(clickedCarto.latitude), c.lon - Cesium.Math.toDegrees(clickedCarto.longitude));
                            if (dist < minDist) {
                                minDist = dist;
                                closestIdx = idx;
                            }
                        });

                        const nodeA = corners[closestIdx];
                        const nodeB = corners[(closestIdx + 1) % corners.length];

                        const topZ = clickedCarto.height;
                        pointP1 = Cesium.Cartesian3.fromDegrees(nodeA.lon, nodeA.lat, topZ);
                        pointP2 = Cesium.Cartesian3.fromDegrees(nodeB.lon, nodeB.lat, topZ);

                        clickStep = 2;
                    }
                }

                if (clickStep === 0) {
                    pointP1 = pickedPosition;
                    clickStep = 1;
                    document.getElementById('instruction').innerHTML = '2. 次にビルの上辺**<span>「右上の角（B地点）」</span>**をクリックしてください。';
                }

                const cartoP1 = Cesium.Cartographic.fromCartesian(pointP1);
                document.getElementById('measuredLatA').value = Cesium.Math.toDegrees(cartoP1.latitude).toFixed(7);
                document.getElementById('measuredLonA').value = Cesium.Math.toDegrees(cartoP1.longitude).toFixed(7);

                const pt1 = viewer.entities.add({
                    position: pointP1,
                    point: { pixelSize: 12, color: Cesium.Color.RED },
                    label: { text: 'A地点 (左上)', font: '12pt sans-serif', pixelOffset: new Cesium.Cartesian2(0, -20) }
                });
                pointEntities.push(pt1);

                if (clickStep === 2) {
                    const cartoP2 = Cesium.Cartographic.fromCartesian(pointP2);
                    document.getElementById('measuredLatB').value = Cesium.Math.toDegrees(cartoP2.latitude).toFixed(7);
                    document.getElementById('measuredLonB').value = Cesium.Math.toDegrees(cartoP2.longitude).toFixed(7);

                    document.getElementById('instruction').innerHTML = '3. コーナー自動抽出完了！「ルート再計算」またはパラメータ調整を行ってください。';
                    const instEl = document.getElementById('instruction');
                    instEl.style.color = '#28a745';
                    instEl.style.borderColor = '#d4edda';
                    instEl.style.background = '#f1f8f5';

                    const pt2 = viewer.entities.add({
                        position: pointP2,
                        point: { pixelSize: 12, color: Cesium.Color.BLUE },
                        label: { text: 'B地点 (右上)', font: '12pt sans-serif', pixelOffset: new Cesium.Cartesian2(0, -20) }
                    });
                    pointEntities.push(pt2);

                    calculateZigzagRoute();
                    document.getElementById('recalculateBtn').removeAttribute('disabled');
                }

            } else if (clickStep === 1) {
                pointP2 = pickedPosition;
                clickStep = 2;
                document.getElementById('instruction').innerHTML = '3. ルート生成完了！パラメータ変更時は「ルート再計算」を押してください。';
                
                const instEl = document.getElementById('instruction');
                instEl.style.color = '#28a745';
                instEl.style.borderColor = '#d4edda';
                instEl.style.background = '#f1f8f5';

                const cartoP2 = Cesium.Cartographic.fromCartesian(pointP2);
                document.getElementById('measuredLatB').value = Cesium.Math.toDegrees(cartoP2.latitude).toFixed(7);
                document.getElementById('measuredLonB').value = Cesium.Math.toDegrees(cartoP2.longitude).toFixed(7);

                const pt2 = viewer.entities.add({
                    position: pointP2,
                    point: { pixelSize: 12, color: Cesium.Color.BLUE },
                    label: { text: 'B地点 (右上)', font: '12pt sans-serif', pixelOffset: new Cesium.Cartesian2(0, -20) }
                });
                pointEntities.push(pt2);

                calculateZigzagRoute();
                document.getElementById('recalculateBtn').removeAttribute('disabled');
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        document.getElementById('recalculateBtn').addEventListener('click', function() {
            if (clickStep < 2) return;
            calculateZigzagRoute();
        });

        document.getElementById('clearSelectionBtn').addEventListener('click', function() {
            clickStep = 0;
            pointP1 = null;
            pointP2 = null;
            generatedWaypoints = [];

            pointEntities.forEach(ent => viewer.entities.remove(ent));
            pointEntities = [];
            if (routeEntity) {
                viewer.entities.remove(routeEntity);
                routeEntity = null;
            }

            document.getElementById('measuredLatA').value = '';
            document.getElementById('measuredLonA').value = '';
            document.getElementById('measuredLatB').value = '';
            document.getElementById('measuredLonB').value = '';

            document.getElementById('recalculateBtn').setAttribute('disabled', 'true');
            document.getElementById('exportBtn').setAttribute('disabled', 'true');
            document.getElementById('exportKmlBtn').setAttribute('disabled', 'true');

            const instEl = document.getElementById('instruction');
            instEl.innerHTML = '1. 地図上でビルをクリックしてください（<strong>コーナー自動抽出モード</strong>）。';
            instEl.style.color = '#d9534f';
            instEl.style.borderColor = '#ebccd1';
            instEl.style.background = '#fdf7f7';
        });

        // 修正版リセットボタン（カメラ位置を動かさずに、ルート・ピン・入力値だけ初期化）
        document.getElementById('resetBtn').addEventListener('click', function() {
            clickStep = 0;
            pointP1 = null;
            pointP2 = null;
            generatedWaypoints = [];

            pointEntities.forEach(ent => viewer.entities.remove(ent));
            pointEntities = [];
            if (routeEntity) {
                viewer.entities.remove(routeEntity);
                routeEntity = null;
            }

            document.getElementById('measuredLatA').value = '';
            document.getElementById('measuredLonA').value = '';
            document.getElementById('measuredLatB').value = '';
            document.getElementById('measuredLonB').value = '';

            document.getElementById('offsetDist').value = "5.0";
            document.getElementById('upwardOffset').value = "0.0";
            document.getElementById('pitchDist').value = "1.0";
            document.getElementById('extendA').value = "0.0";
            document.getElementById('extendB').value = "0.0";
            document.getElementById('minHeightFromGround').value = "2.0";

            document.getElementById('recalculateBtn').setAttribute('disabled', 'true');
            document.getElementById('exportBtn').setAttribute('disabled', 'true');
            document.getElementById('exportKmlBtn').setAttribute('disabled', 'true');

            const instEl = document.getElementById('instruction');
            instEl.innerHTML = '1. 地図上でビルをクリックしてください（<strong>コーナー自動抽出モード</strong>）。';
            instEl.style.color = '#d9534f';
            instEl.style.borderColor = '#ebccd1';
            instEl.style.background = '#fdf7f7';

            alert('ルートおよび設定値を初期化しました（現在のカメラ位置は維持されます）。');
        });

        function calculateZigzagRoute() {
            const offsetDist = parseFloat(document.getElementById('offsetDist').value) || 5.0;
            const upwardOffset = parseFloat(document.getElementById('upwardOffset').value) || 0.0;
            const pitchDist = parseFloat(document.getElementById('pitchDist').value) || 1.0;
            const extendA = parseFloat(document.getElementById('extendA').value) || 0.0;
            const extendB = parseFloat(document.getElementById('extendB').value) || 0.0;
            const minHeightFromGround = parseFloat(document.getElementById('minHeightFromGround').value) || 2.0;

            const measLatA = parseFloat(document.getElementById('measuredLatA').value);
            const measLonA = parseFloat(document.getElementById('measuredLonA').value);
            const measLatB = parseFloat(document.getElementById('measuredLatB').value);
            const measLonB = parseFloat(document.getElementById('measuredLonB').value);

            if (routeEntity) {
                viewer.entities.remove(routeEntity);
                routeEntity = null;
            }

            let modelShift = new Cesium.Cartesian3(0, 0, 0);

            if (!isNaN(measLatA) && !isNaN(measLonA)) {
                const cartoModelA = Cesium.Cartographic.fromCartesian(pointP1);
                const measuredCartoA = Cesium.Cartographic.fromDegrees(measLonA, measLatA, cartoModelA.height);
                const effectiveMeasuredA = Cesium.Cartographic.toCartesian(measuredCartoA);
                modelShift = Cesium.Cartesian3.subtract(effectiveMeasuredA, pointP1, new Cesium.Cartesian3());
            } else if (!isNaN(measLatB) && !isNaN(measLonB)) {
                const cartoModelB = Cesium.Cartographic.fromCartesian(pointP2);
                const measuredCartoB = Cesium.Cartographic.fromDegrees(measLonB, measLatB, cartoModelB.height);
                const effectiveMeasuredB = Cesium.Cartographic.toCartesian(measuredCartoB);
                modelShift = Cesium.Cartesian3.subtract(effectiveMeasuredB, pointP2, new Cesium.Cartesian3());
            }

            const effectiveP1 = Cesium.Cartesian3.add(pointP1, modelShift, new Cesium.Cartesian3());
            const effectiveP2 = Cesium.Cartesian3.add(pointP2, modelShift, new Cesium.Cartesian3());

            const midpoint = Cesium.Cartesian3.midpoint(effectiveP1, effectiveP2, new Cesium.Cartesian3());
            const transform = Cesium.Transforms.eastNorthUpToFixedFrame(midpoint);
            const invTransform = Cesium.Matrix4.inverse(transform, new Cesium.Matrix4());

            const localP1 = Cesium.Matrix4.multiplyByPoint(invTransform, effectiveP1, new Cesium.Cartesian3());
            const localP2 = Cesium.Matrix4.multiplyByPoint(invTransform, effectiveP2, new Cesium.Cartesian3());

            const dx = localP2.x - localP1.x;
            const dy = localP2.y - localP1.y;
            const horizLen = Math.sqrt(dx * dx + dy * dy);

            if (horizLen === 0) {
                alert('A地点とB地点が同じ位置です。');
                return;
            }

            const ux = dx / horizLen;
            const uy = dy / horizLen;

            const nx = uy;
            const ny = -ux;

            const extA_x = localP1.x - ux * extendA;
            const extA_y = localP1.y - uy * extendA;
            const extB_x = localP2.x + ux * extendB;
            const extB_y = localP2.y + uy * extendB;

            const offsetX = nx * offsetDist;
            const offsetY = ny * offsetDist;

            generatedWaypoints = [];
            
            const topZ = localP1.z + upwardOffset;
            const groundZ = localP1.z - detectedBuildingHeight;
            const targetLowestZ = groundZ + minHeightFromGround;

            let currentZ = topZ;
            let rowIndex = 0;

            while (currentZ >= targetLowestZ) {
                let startLocal, endLocal;

                if (rowIndex % 2 === 0) {
                    startLocal = new Cesium.Cartesian3(extA_x + offsetX, extA_y + offsetY, currentZ);
                    endLocal = new Cesium.Cartesian3(extB_x + offsetX, extB_y + offsetY, currentZ);
                } else {
                    startLocal = new Cesium.Cartesian3(extB_x + offsetX, extB_y + offsetY, currentZ);
                    endLocal = new Cesium.Cartesian3(extA_x + offsetX, extA_y + offsetY, currentZ);
                }

                const globalStart = Cesium.Matrix4.multiplyByPoint(transform, startLocal, new Cesium.Cartesian3());
                const globalEndCorrect = Cesium.Matrix4.multiplyByPoint(transform, endLocal, new Cesium.Cartesian3());

                generatedWaypoints.push(globalStart);
                generatedWaypoints.push(globalEndCorrect);

                currentZ -= pitchDist;
                rowIndex++;
            }

            if (generatedWaypoints.length < 2) {
                alert('有効なルート座標が生成されませんでした。設定値を確認してください。');
                return;
            }

            routeEntity = viewer.entities.add({
                polyline: {
                    positions: generatedWaypoints,
                    width: 4,
                    material: Cesium.Color.YELLOW
                }
            });

            document.getElementById('exportBtn').removeAttribute('disabled');
            document.getElementById('exportKmlBtn').removeAttribute('disabled');
        }

        // CSVエクスポート
        document.getElementById('exportBtn').addEventListener('click', function() {
            if (generatedWaypoints.length === 0) return;

            let csvContent = "data:text/csv;charset=utf-8,No,Latitude,Longitude,Height(m),X,Y,Z\n";
            
            generatedWaypoints.forEach((pt, index) => {
                const cartographic = Cesium.Cartographic.fromCartesian(pt);
                const lat = Cesium.Math.toDegrees(cartographic.latitude);
                const lon = Cesium.Math.toDegrees(cartographic.longitude);
                const height = cartographic.height;
                csvContent += `${index + 1},${lat.toFixed(8)},${lon.toFixed(8)},${height.toFixed(2)},${pt.x.toFixed(2)},${pt.y.toFixed(2)},${pt.z.toFixed(2)}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "drone_zigzag_flight_route.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // KMLエクスポート
        document.getElementById('exportKmlBtn').addEventListener('click', function() {
            if (generatedWaypoints.length === 0) return;

            let coordsText = "";
            generatedWaypoints.forEach((pt) => {
                const cartographic = Cesium.Cartographic.fromCartesian(pt);
                const lat = Cesium.Math.toDegrees(cartographic.latitude);
                const lon = Cesium.Math.toDegrees(cartographic.longitude);
                const height = cartographic.height;
                coordsText += `${lon.toFixed(8)},${lat.toFixed(8)},${height.toFixed(2)} `;
            });

            const kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>Drone Zigzag Flight Route</name>
    <Placemark>
      <name>Flight Path</name>
      <LineString>
        <tessellate>1</tessellate>
        <altitudeMode>absolute</altitudeMode>
        <coordinates>
          ${coordsText.trim()}
        </coordinates>
      </LineString>
    </Placemark>
  </Document>
</kml>`;

            const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "drone_zigzag_route.kml");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
