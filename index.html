<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドローン外壁ジグザグ飛行ルート生成アプリ</title>
    <!-- CesiumJS CSS -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif;
        }
        #panel {
            position: absolute; top: 15px; left: 15px; background: rgba(255, 255, 255, 0.95);
            padding: 20px; border-radius: 8px; z-index: 100; width: 340px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h3 { margin-top: 0; font-size: 16px; color: #333; }
        label { display: block; margin-top: 10px; font-size: 13px; font-weight: bold; color: #444; }
        input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 8px; margin-top: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
        .btn-primary { background: #007bff; }
        .btn-primary:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-success:disabled { background: #ccc; cursor: not-allowed; }
        .btn-plateau { background: #ffc107; color: #333; }
        .btn-plateau:hover { background: #e0a800; }
        .status { margin-top: 12px; font-size: 13px; color: #d9534f; background: #fdf7f7; padding: 10px; border-radius: 4px; border: 1px solid #ebccd1; line-height: 1.4; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    
    <div id="panel">
        <h3>外壁点検ルート自動生成</h3>
        <div class="status" id="instruction">
            1. 3Dモデル上のビルの上辺**「左上の角」**をクリックしてください。
        </div>

        <!-- PLATEAUデータ読込ボタン -->
        <button id="plateauBtn" class="btn-plateau">PLATEAU 3Dモデル読込</button>

        <label>壁からのオフセット距離 (m):</label>
        <input type="number" id="offsetDist" value="5.0" step="0.5">
        
        <label>垂直ピッチ間隔 (m):</label>
        <input type="number" id="pitchDist" value="1.0" step="0.5">

        <label>測定総高さ (m):</label>
        <input type="number" id="totalHeight" value="15.0" step="1.0">

        <button id="exportBtn" class="btn-success" disabled>ルート座標をCSVダウンロード</button>
        <button id="resetBtn" class="btn-secondary">リセット（初期位置に戻る）</button>
    </div>

    <!-- CesiumJS JS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    <script>
        Cesium.Ion.defaultAccessToken = 'YOUR_CESIUM_ION_TOKEN'; // 必要に応じてご自身のトークンを設定

        // 1. 初期位置および「その日の2回目以降は直前の位置」を復元するロジック
        const defaultLocation = {
            lon: 135.524223, // 大阪市天王寺区勝山4-9-17の経度
            lat: 34.654049,  // 大阪市天王寺区勝山4-9-17の緯度
            height: 400,
            heading: 0.0,
            pitch: -45.0,
            roll: 0.0
        };

        const todayStr = new Date().toISOString().split('T')[0];
        const savedDate = localStorage.getItem('drone_app_date');
        const savedPos = JSON.parse(localStorage.getItem('drone_app_position') || 'null');

        let initialCam = defaultLocation;
        if (savedDate === todayStr && savedPos) {
            // その日の2回目以降：直前の位置を適用
            initialCam = savedPos;
        } else {
            // その日の初回：日付を今日に更新し、デフォルト（勝山4-9-17）を適用
            localStorage.setItem('drone_app_date', todayStr);
        }

        // ビューアの初期化
        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain()
        });

        // カメラ視点の設定
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(initialCam.lon, initialCam.lat, initialCam.height),
            orientation: {
                heading: Cesium.Math.toRadians(initialCam.heading),
                pitch: Cesium.Math.toRadians(initialCam.pitch),
                roll: Cesium.Math.toRadians(initialCam.roll)
            }
        });

        // カメラが動いたときに位置をローカルストレージに自動保存
        viewer.camera.moveEnd.addEventListener(() => {
            const cartographic = viewer.camera.positionCartographic;
            const currentPos = {
                lon: Cesium.Math.toDegrees(cartographic.longitude),
                lat: Cesium.Math.toDegrees(cartographic.latitude),
                height: cartographic.height,
                heading: Cesium.Math.toDegrees(viewer.camera.heading),
                pitch: Cesium.Math.toDegrees(viewer.camera.pitch),
                roll: Cesium.Math.toDegrees(viewer.camera.roll)
            };
            localStorage.setItem('drone_app_position', JSON.stringify(currentPos));
            localStorage.setItem('drone_app_date', new Date().toISOString().split('T')[0]);
        });

        // デフォルト背景モデルのロード
        async function init3DMap() {
            try {
                const googleBuildings = await Cesium.createGooglePhotorealistic3DTileset();
                viewer.scene.primitives.add(googleBuildings);
            } catch (e) {
                const osmBuildings = await Cesium.createOsmBuildingsAsync();
                viewer.scene.primitives.add(osmBuildings);
            }
        }
        init3DMap();

        // 2. PLATEAUデータ読込ボタンの処理
        let plateauTileset = null;
        document.getElementById('plateauBtn').addEventListener('click', async function() {
            if (plateauTileset) {
                alert('PLATEAUモデルは既に読み込まれています。');
                return;
            }
            const inputVal = prompt("PLATEAUの3D Tiles (tileset.json) のURL、またはCesium ionのアセットIDを入力してください:");
            if (!inputVal) return;

            try {
                if (!isNaN(inputVal)) {
                    plateauTileset = await Cesium.Cesium3DTileset.fromAssetId(parseInt(inputVal));
                } else {
                    plateauTileset = await Cesium.Cesium3DTileset.fromUrl(inputVal);
                }
                viewer.scene.primitives.add(plateauTileset);
                viewer.zoomTo(plateauTileset);
                alert('PLATEAUモデルを読み込みました。');
            } catch (err) {
                console.error(err);
                alert('読込に失敗しました。URLまたはアセットIDが正しいか確認してください。');
            }
        });

        // 状態変数
        let clickStep = 0;
        let pointP1 = null;
        let pointP2 = null;
        let generatedWaypoints = [];

        // クリックイベント処理
        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        handler.setInputAction(function (movement) {
            const pickedPosition = viewer.scene.pickPosition(movement.position);
            if (!pickedPosition) return;

            if (clickStep === 0) {
                pointP1 = pickedPosition;
                clickStep = 1;
                document.getElementById('instruction').innerHTML = '2. 次にビルの上辺**「右上の角」**をクリックしてください。';
                
                viewer.entities.add({
                    position: pointP1,
                    point: { pixelSize: 12, color: Cesium.Color.RED },
                    label: { text: 'P1 (左上)', font: '12pt sans-serif', pixelOffset: new Cesium.Cartesian2(0, -20) }
                });
            } else if (clickStep === 1) {
                pointP2 = pickedPosition;
                clickStep = 2;
                document.getElementById('instruction').innerHTML = '3. ルート生成完了！下部のボタンからCSVを出力できます。';
                document.getElementById('instruction').style.color = '#28a745';
                document.getElementById('instruction').style.borderColor = '#d4edda';
                document.getElementById('instruction').style.background = '#f1f8f5';

                viewer.entities.add({
                    position: pointP2,
                    point: { pixelSize: 12, color: Cesium.Color.BLUE },
                    label: { text: 'P2 (右上)', font: '12pt sans-serif', pixelOffset: new Cesium.Cartesian2(0, -20) }
                });

                calculateZigzagRoute();
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        // ジグザグ飛行ルートの計算ロジック
        function calculateZigzagRoute() {
            const offsetDist = parseFloat(document.getElementById('offsetDist').value);
            const pitchDist = parseFloat(document.getElementById('pitchDist').value);
            const totalHeight = parseFloat(document.getElementById('totalHeight').value);

            const midpoint = Cesium.Cartesian3.midpoint(pointP1, pointP2, new Cesium.Cartesian3());
            const transform = Cesium.Transforms.eastNorthUpToFixedFrame(midpoint);
            const invTransform = Cesium.Matrix4.inverse(transform, new Cesium.Matrix4());

            const localP1 = Cesium.Matrix4.multiplyByPoint(invTransform, pointP1, new Cesium.Cartesian3());
            const localP2 = Cesium.Matrix4.multiplyByPoint(invTransform, pointP2, new Cesium.Cartesian3());

            const wallOffset = -offsetDist;

            generatedWaypoints = [];
            const numRows = Math.floor(totalHeight / pitchDist);

            for (let i = 0; i <= numRows; i++) {
                const currentZ = localP1.z - (i * pitchDist);
                let startLocal, endLocal;

                if (i % 2 === 0) {
                    startLocal = new Cesium.Cartesian3(localP1.x, localP1.y + wallOffset, currentZ);
                    endLocal = new Cesium.Cartesian3(localP2.x, localP2.y + wallOffset, currentZ);
                } else {
                    startLocal = new Cesium.Cartesian3(localP2.x, localP2.y + wallOffset, currentZ);
                    endLocal = new Cesium.Cartesian3(localP1.x, localP1.y + wallOffset, currentZ);
                }

                const globalStart = Cesium.Matrix4.multiplyByPoint(transform, startLocal, new Cesium.Cartesian3());
                const globalEnd = Cesium.Matrix4.multiplyByPoint(transform, endLocal, new Cesium.Cartesian3());

                generatedWaypoints.push(globalStart);
                generatedWaypoints.push(globalEnd);
            }

            const flatPositions = [];
            generatedWaypoints.forEach(pt => {
                flatPositions.push(pt.x, pt.y, pt.z);
            });

            viewer.entities.add({
                polyline: {
                    positions: Cesium.Cartesian3.fromArray(flatPositions),
                    width: 4,
                    material: Cesium.Color.YELLOW
                }
            });

            document.getElementById('exportBtn').removeAttribute('disabled');
        }

        // CSVエクスポート
        document.getElementById('exportBtn').addEventListener('click', function() {
            if (generatedWaypoints.length === 0) return;

            let csvContent = "data:text/csv;charset=utf-8,No,Latitude,Longitude,Height(m),X,Y,Z\n";
            
            generatedWaypoints.forEach((pt, index) => {
                const cartographic = Cesium.Cartographic.fromCartesian(pt);
                const lat = Cesium.Math.toDegrees(cartographic.latitude);
                const lon = Cesium.Math.toDegrees(cartographic.longitude);
                const height = cartographic.height;
                csvContent += `${index + 1},${lat.toFixed(8)},${lon.toFixed(8)},${height.toFixed(2)},${pt.x.toFixed(2)},${pt.y.toFixed(2)},${pt.z.toFixed(2)}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "drone_zigzag_flight_route.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // リセット（勝山4-9-17の初期位置に戻してストレージをクリアする場合や再読込）
        document.getElementById('resetBtn').addEventListener('click', function() {
            localStorage.removeItem('drone_app_position');
            location.reload();
        });
    </script>
</body>
</html>
