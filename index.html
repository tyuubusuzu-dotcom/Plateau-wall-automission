<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドローン外壁ジグザグ飛行ルート生成アプリ</title>
    <!-- Cesiumの内部ファイルを正しく読み込むための必須設定 -->
    <script>
        window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/';
    </script>
    <!-- CesiumJS CSS -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background: #1e1e1e;
        }
        #panel {
            position: absolute; top: 15px; left: 15px; background: rgba(255, 255, 255, 0.95);
            padding: 15px; border-radius: 8px; z-index: 100; width: 360px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-height: 90vh; overflow-y: auto;
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-bottom: 10px; }
        h3 { margin: 0; font-size: 15px; color: #333; }
        .version { font-size: 11px; color: #666; font-weight: bold; }
        label { display: block; margin-top: 8px; font-size: 12px; font-weight: bold; color: #444; }
        input[type="text"], input[type="number"] { width: 100%; padding: 6px; margin-top: 3px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        button { width: 100%; padding: 8px; margin-top: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; font-size: 13px; }
        .btn-primary { background: #007bff; }
        .btn-primary:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #218838; }
        .btn-success:disabled, .btn-warning:disabled { background: #ccc; cursor: not-allowed; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-warning:hover { background: #e0a800; }
        .btn-3d { background: #17a2b8; color: #fff; }
        .btn-3d:hover { background: #138496; }
        .status { margin-top: 10px; font-size: 12px; color: #d9534f; background: #fdf7f7; padding: 8px; border-radius: 4px; border: 1px solid #ebccd1; line-height: 1.4; }
        .search-box { display: flex; gap: 5px; margin-top: 4px; }
        .search-box input { flex: 1; }
        .search-box button { width: 80px; margin-top: 0; padding: 6px; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    
    <div id="panel">
        <div class="panel-header">
            <h3>外壁点検ルート自動生成</h3>
            <span class="version">Ver.1.7.4</span>
        </div>

        <!-- 住所検索Box -->
        <label>住所・地名検索:</label>
        <div class="search-box">
            <input type="text" id="addressInput" placeholder="例: 大阪市中央区難波1丁目">
            <button id="searchBtn" class="btn-primary">検索</button>
        </div>

        <!-- 3Dビルモデル読込ボタン -->
        <button id="load3dBtn" class="btn-3d">3Dビルモデルを表示する</button>

        <div class="status" id="instruction">
            1. 地図上でビルを探し、3D表示させてから上辺の**<span>「左上の角（A地点）」</span>**をクリックしてください。
        </div>

        <label>壁からのオフセット距離 (m):</label>
        <input type="number" id="offsetDist" value="5.0" step="0.5">
        
        <label>垂直ピッチ（何mおきに下がるか） (m):</label>
        <input type="number" id="pitchDist" value="1.0" step="0.5">

        <label>A側（左）の延長距離 (m):</label>
        <input type="number" id="extendA" value="0.0" step="0.5">

        <label>B側（右）の延長距離 (m):</label>
        <input type="number" id="extendB" value="0.0" step="0.5">

        <label>飛行させない最低地上高 (m):</label>
        <input type="number" id="minHeightFromGround" value="2.0" step="0.5">

        <button id="recalculateBtn" class="btn-warning" disabled>ルート再計算</button>
        <button id="exportBtn" class="btn-success" disabled>ルート座標をCSVダウンロード</button>
        <button id="resetBtn" class="btn-secondary">リセット（初期位置に戻る）</button>
    </div>

    <!-- CesiumJS JS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    <script>
        // 設定されたCesium ionアクセストークン
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjdlVjdMdUZ0VHhhdFlxTkoiLCJqdGkiOiIzZjY3NzkwNy1jMTVlLTQwYzEtYjZkMS1hZDgxY2Y0ODA3YWEiLCJpZCI6NDkzOTQ3LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3ODkzODYwNjR9.wV7l2BvempXsAWlEzEkLuyh2KDeCOqmlx1-NnF69yKw';

        // 初期位置（大阪市天王寺区勝山付近）
        const defaultLocation = {
            lon: 135.524223,
            lat: 34.654049,
            height: 400,
            heading: 0.0,
            pitch: -45.0,
            roll: 0.0
        };

        const todayStr = new Date().toISOString().split('T')[0];
        const savedDate = localStorage.getItem('drone_app_date');
        const savedPos = JSON.parse(localStorage.getItem('drone_app_position') || 'null');

        let initialCam = (savedDate === todayStr && savedPos) ? savedPos : defaultLocation;
        if (savedDate !== todayStr) {
            localStorage.setItem('drone_app_date', todayStr);
        }

        // ビューアの初期化（背景地図を確実に出すためCesium公式World Imageryを使用）
        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            sceneModePicker: false,
            navigationHelpButton: false
        });

        // Cesium ionの高画質背景マップを非同期で追加
        async function initBaseImagery() {
            try {
                const imageryProvider = await Cesium.createWorldImageryAsync();
                viewer.imageryLayers.addImageryProvider(imageryProvider);
            } catch (e) {
                console.error("背景画像の読み込みに失敗しました:", e);
            }
        }
        initBaseImagery();

        // カメラ視点適用
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(initialCam.lon, initialCam.lat, initialCam.height),
            orientation: {
                heading: Cesium.Math.toRadians(initialCam.heading),
                pitch: Cesium.Math.toRadians(initialCam.pitch),
                roll: Cesium.Math.toRadians(initialCam.roll)
            }
        });

        // カメラ移動時に位置を自動保存
        viewer.camera.moveEnd.addEventListener(() => {
            const cartographic = viewer.camera.positionCartographic;
            const currentPos = {
                lon: Cesium.Math.toDegrees(cartographic.longitude),
                lat: Cesium.Math.toDegrees(cartographic.latitude),
                height: cartographic.height,
                heading: Cesium.Math.toDegrees(viewer.camera.heading),
                pitch: Cesium.Math.toDegrees(viewer.camera.pitch),
                roll: Cesium.Math.toDegrees(viewer.camera.roll)
            };
            localStorage.setItem('drone_app_position', JSON.stringify(currentPos));
            localStorage.setItem('drone_app_date', new Date().toISOString().split('T')[0]);
        });

        // 住所検索機能（日本国内限定）
        async function searchAddress() {
            const query = document.getElementById('addressInput').value.trim();
            if (!query) return;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=jp&q=${encodeURIComponent(query)}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    const lon = parseFloat(data[0].lon);
                    const lat = parseFloat(data[0].lat);
                    viewer.camera.flyTo({
                        destination: Cesium.Cartesian3.fromDegrees(lon, lat, 300),
                        orientation: { heading: 0.0, pitch: Cesium.Math.toRadians(-45), roll: 0.0 }
                    });
                } else {
                    alert('該当する場所が見つかりませんでした。別のキーワードでお試しください。');
                }
            } catch (e) {
                console.error(e);
                alert('住所検索の通信に失敗しました。');
            }
        }

        document.getElementById('searchBtn').addEventListener('click', searchAddress);
        document.getElementById('addressInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchAddress();
        });

        // 3Dビルモデル読込ボタン（OSM Buildings）
        let buildingsLoaded = false;
        document.getElementById('load3dBtn').addEventListener('click', async function() {
            if (buildingsLoaded) {
                alert('3Dビルモデルは既に表示されています。');
                return;
            }
            try {
                const osmBuildings = await Cesium.createOsmBuildingsAsync();
                viewer.scene.primitives.add(osmBuildings);
                buildingsLoaded = true;
                alert('3Dビルモデルを正常に読み込みました！');
            } catch (err) {
                console.error(err);
                alert('3Dビルの読み込みに失敗しました。');
            }
        });

        // 状態変数
        let clickStep = 0;
        let pointP1 = null; // A地点
        let pointP2 = null; // B地点
        let detectedBuildingHeight = 30.0; // estimatedHeightから取得するビル高さ（デフォルト30m）
        let generatedWaypoints = [];
        let routeEntity = null; // 描画したルートエンティティ管理用

        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
        handler.setInputAction(function (movement) {
            const picked = viewer.scene.pick(movement.position);
            const pickedPosition = viewer.scene.pickPosition(movement.position);
            if (!pickedPosition) {
                alert('3Dビルモデルの表面を正確にクリックしてください。');
                return;
            }

            if (clickStep === 0) {
                pointP1 = pickedPosition;
                
                // estimatedHeightの自動取得
                if (picked && picked.getProperty) {
                    const estH = picked.getProperty('cesium#estimatedHeight') || picked.getProperty('height');
                    if (estH) {
                        detectedBuildingHeight = parseFloat(estH);
                    }
                }

                clickStep = 1;
                document.getElementById('instruction').innerHTML = '2. 次にビルの上辺**<span>「右上の角（B地点）」</span>**をクリックしてください。';
                
                viewer.entities.add({
                    position: pointP1,
                    point: { pixelSize: 12, color: Cesium.Color.RED },
                    label: { text: 'A地点 (左上)', font: '12pt sans-serif', pixelOffset: new Cesium.Cartesian2(0, -20) }
                });
            } else if (clickStep === 1) {
                pointP2 = pickedPosition;
                clickStep = 2;
                document.getElementById('instruction').innerHTML = '3. ルート生成完了！パラメータ変更時は「ルート再計算」を押してください。';
                
                const instEl = document.getElementById('instruction');
                instEl.style.color = '#28a745';
                instEl.style.borderColor = '#d4edda';
                instEl.style.background = '#f1f8f5';

                viewer.entities.add({
                    position: pointP2,
                    point: { pixelSize: 12, color: Cesium.Color.BLUE },
                    label: { text: 'B地点 (右上)', font: '12pt sans-serif', pixelOffset: new Cesium.Cartesian2(0, -20) }
                });

                // ルート計算実行
                calculateZigzagRoute();

                // ボタン有効化
                document.getElementById('recalculateBtn').removeAttribute('disabled');
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        // 「ルート再計算」ボタンイベント
        document.getElementById('recalculateBtn').addEventListener('click', function() {
            if (clickStep < 2) return;
            calculateZigzagRoute();
        });

        // ジグザグ飛行ルートの計算
        function calculateZigzagRoute() {
            const offsetDist = parseFloat(document.getElementById('offsetDist').value) || 5.0;
            const pitchDist = parseFloat(document.getElementById('pitchDist').value) || 1.0;
            const extendA = parseFloat(document.getElementById('extendA').value) || 0.0;
            const extendB = parseFloat(document.getElementById('extendB').value) || 0.0;
            const minHeightFromGround = parseFloat(document.getElementById('minHeightFromGround').value) || 2.0;

            if (routeEntity) {
                viewer.entities.remove(routeEntity);
                routeEntity = null;
            }

            const midpoint = Cesium.Cartesian3.midpoint(pointP1, pointP2, new Cesium.Cartesian3());
            const transform = Cesium.Transforms.eastNorthUpToFixedFrame(midpoint);
            const invTransform = Cesium.Matrix4.inverse(transform, new Cesium.Matrix4());

            const localP1 = Cesium.Matrix4.multiplyByPoint(invTransform, pointP1, new Cesium.Cartesian3());
            const localP2 = Cesium.Matrix4.multiplyByPoint(invTransform, pointP2, new Cesium.Cartesian3());

            // AからBへの水平方向（X:東, Y:北）のベクトルと長さを計算
            const dx = localP2.x - localP1.x;
            const dy = localP2.y - localP1.y;
            const horizLen = Math.sqrt(dx * dx + dy * dy);

            if (horizLen === 0) {
                alert('A地点とB地点が同じ位置です。');
                return;
            }

            // 壁の方向の単位ベクトル (ux, uy)
            const ux = dx / horizLen;
            const uy = dy / horizLen;

            // 法線ベクトル（ビル外側を向く方向）
            const nx = uy;
            const ny = -ux;

            // 延長を考慮したA'とB'のローカル座標
            const extA_x = localP1.x - ux * extendA;
            const extA_y = localP1.y - uy * extendA;
            const extB_x = localP2.x + ux * extendB;
            const extB_y = localP2.y + uy * extendB;

            // オフセット（壁から指定距離外側へ離す）
            const offsetX = nx * offsetDist;
            const offsetY = ny * offsetDist;

            generatedWaypoints = [];
            const topZ = localP1.z;
            const groundZ = localP1.z - detectedBuildingHeight;
            const targetLowestZ = groundZ + minHeightFromGround;

            let currentZ = topZ;
            let rowIndex = 0;

            while (currentZ >= targetLowestZ) {
                let startLocal, endLocal;

                if (rowIndex % 2 === 0) {
                    // 偶数行: A側からB側へ
                    startLocal = new Cesium.Cartesian3(extA_x + offsetX, extA_y + offsetY, currentZ);
                    endLocal = new Cesium.Cartesian3(extB_x + offsetX, extB_y + offsetY, currentZ);
                } else {
                    // 奇数行: B側からA側へ（ジグザグ）
                    startLocal = new Cesium.Cartesian3(extB_x + offsetX, extB_y + offsetY, currentZ);
                    endLocal = new Cesium.Cartesian3(extA_x + offsetX, extA_y + offsetY, currentZ);
                }

                const globalStart = Cesium.Matrix4.multiplyByPoint(transform, startLocal, new Cesium.Cartesian3());
                const globalEndCorrect = Cesium.Matrix4.multiplyByPoint(transform, endLocal, new Cesium.Cartesian3());

                generatedWaypoints.push(globalStart);
                generatedWaypoints.push(globalEndCorrect);

                currentZ -= pitchDist;
                rowIndex++;
            }

            if (generatedWaypoints.length < 2) {
                alert('有効なルート座標が生成されませんでした。設定値を確認してください。');
                return;
            }

            // 3Dビューア上にルート（黄色い線）を描画
            routeEntity = viewer.entities.add({
                polyline: {
                    positions: generatedWaypoints,
                    width: 4,
                    material: Cesium.Color.YELLOW
                }
            });

            document.getElementById('exportBtn').removeAttribute('disabled');
        }

        // CSVエクスポート
        document.getElementById('exportBtn').addEventListener('click', function() {
            if (generatedWaypoints.length === 0) return;

            let csvContent = "data:text/csv;charset=utf-8,No,Latitude,Longitude,Height(m),X,Y,Z\n";
            
            generatedWaypoints.forEach((pt, index) => {
                const cartographic = Cesium.Cartographic.fromCartesian(pt);
                const lat = Cesium.Math.toDegrees(cartographic.latitude);
                const lon = Cesium.Math.toDegrees(cartographic.longitude);
                const height = cartographic.height;
                csvContent += `${index + 1},${lat.toFixed(8)},${lon.toFixed(8)},${height.toFixed(2)},${pt.x.toFixed(2)},${pt.y.toFixed(2)},${pt.z.toFixed(2)}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "drone_zigzag_flight_route.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // リセット
        document.getElementById('resetBtn').addEventListener('click', function() {
            localStorage.removeItem('drone_app_position');
            location.reload();
        });
    </script>
</body>
</html>
